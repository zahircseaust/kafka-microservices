server:
  port: 8084

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/authdb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        retries: 5

app:
  kafka:
    topic:
      user-events: user-events

# NOTE: this secret MUST match the one configured in order-service, since both
# services verify HS256 JWTs with the same symmetric key. In a real system you'd
# use an asymmetric key pair (auth-service signs with a private key, other services
# verify with the public key/JWKS endpoint) or a proper OAuth2 Authorization Server.
jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-that-is-at-least-32-bytes-long!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.example.authservice: INFO
    org.apache.kafka: WARN
