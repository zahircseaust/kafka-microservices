server:
  port: 8083

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notificationdb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # NOTE: this service consumes two Kafka topics carrying two different event shapes
    # (InventoryEvent and UserRegisteredEvent), so instead of one auto-configured
    # consumer factory with a single default JSON type, KafkaConsumerConfig builds
    # one ConsumerFactory/ListenerContainerFactory bean per event type explicitly.

app:
  kafka:
    topic:
      inventory-events: inventory-events
      user-events: user-events

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.example.notificationservice: INFO
    org.apache.kafka: WARN
